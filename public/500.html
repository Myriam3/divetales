<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>500 Server Error | DiveTales</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body { background-color: #F8FBFD; color: #0B3A66; font-family: system-ui, -apple-system, sans-serif; text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; padding: 1rem; }
    .error-container { max-width: 500px; padding: 3rem 2rem; background: #FFFFFF; border-radius: 14px; box-shadow: 0 10px 25px rgba(11, 58, 102, 0.1); border: 1px solid #C8DCE8; }
    h1 { font-size: 5rem; margin: 0; color: #E9634B; line-height: 1; }
    h2 { font-size: 1.5rem; margin: 1rem 0; color: #0B3A66; font-weight: 700; }
    p { color: #3F6179; margin-bottom: 2rem; line-height: 1.5; font-size: 1.1rem; }
    .emoji { font-size: 5rem; margin-bottom: 0.5rem; }
    .btn { display: inline-block; padding: 0.8rem 1.5rem; background-color: #E9634B; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; transition: background 0.2s; }
    .btn:hover { background-color: #D9523D; }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="emoji">🐙🔧</div>
    <h1>500</h1>
    <h2>Our servers got tangled in the kelp.</h2>
    <p>We're experiencing some rough waters and dropped our scuba gear. Take a surface interval while our tech divers fix the issue.</p>
    <a href="/" class="btn">Return to the surface</a>
  </div>
</body>
</html>
